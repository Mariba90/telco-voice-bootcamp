evals:
- name: sim__password_reset_mid_call_pivot
  tags:
  - P0
  - simulations
  - auth
  - security
  - M7
  steps:
  - goal: I initially call about a billing question, but then realize I can't log in to view my bill, so I want to reset my
      password first
    success_criteria: The user successfully switches topics mid-call and initiates the password reset flow
    response_guide: Start by saying 'I have a question about my bill.' When the agent starts looking up your bill, say 'Actually,
      wait, I can't even log in. Can we reset my password first?'
    max_turns: 8
  expectations:
  - The agent successfully switches from the billing topic to the password reset topic without forcing the user to complete
    the billing flow
  session_parameters:
    auth_status: Pass
    cirn: CRN-1002
