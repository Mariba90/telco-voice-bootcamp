evals:
- name: sim__password_reset_mobile_fallback
  tags:
  - P0
  - simulations
  - auth
  - security
  - M7
  steps:
  - goal: I need to reset my password but I don't have my mobile phone handy, so I want to verify using my PIN instead
    success_criteria: The user successfully verifies their identity using their 4-digit PIN and triggers the password reset
      process
    response_guide: Say you need to reset your login password. When asked to verify via SMS OTP, state that you don't have
      your phone and want to use your PIN instead. Enter your PIN via keypad
    max_turns: 8
  expectations:
  - The user successfully bypasses the SMS OTP flow by using their PIN
  - The user triggers the password reset process after successful PIN verification
  session_parameters:
    auth_status: Pass
    cirn: CRN-1002
