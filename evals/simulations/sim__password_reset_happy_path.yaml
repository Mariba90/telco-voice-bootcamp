evals:
- name: sim__password_reset_happy_path
  tags:
  - P0
  - simulations
  - auth
  - security
  - M7
  steps:
  - goal: I forgot my online account password and need to reset it using a link sent to my phone
    success_criteria: The user receives a password reset link via SMS and is informed of its 30-minute validity
    response_guide: Say 'I forgot my password.' Provide your phone number, verify your identity via the code sent to you,
      and accept the SMS reset link
    max_turns: 8
  expectations:
  - The user is sent a password reset link via SMS
  - The user is informed that the link is valid for 30 minutes
  session_parameters:
    auth_status: Pass
    cirn: CRN-1002
