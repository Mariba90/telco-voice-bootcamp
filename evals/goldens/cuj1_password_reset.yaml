common_session_parameters:
  clid: "555-0199"
  cirn: "CRN-1002"

conversations:
  - conversation: golden__cuj1__password_reset_otp
    tags: [P0, CUJ-1, goldens, auth, password_reset]
    session_parameters:
      auth_status: "Pass"
    turns:
      - user: "<event>welcome</event>"
        agent: "Thanks for calling Telco Voice Central. This call may be recorded for quality and training. How can I help you today?"
      - user: "I forgot my online account password and need to reset it."
        agent: "I can help you reset your password. I'll send a 6-digit verification code to your mobile phone ending in 1234."
        tool_calls:
          - action: send_authentication_otp
            args:
              destination: "555-0199"
      - user: "I got the code, it is 654321."
        agent: "Thank you. Your identity is verified. I've sent a secure password reset link to your phone, valid for 30 minutes."
        tool_calls:
          - action: validate_authentication_otp
            args:
              code: "654321"
          - action: send_password_reset_sms
            args:
              cirn: "CRN-1002"
    expectations:
      - "There must be a validate_authentication_otp tool call"
      - "There must be a send_password_reset_sms tool call"
      - "The agent response must not leak the raw security code"
